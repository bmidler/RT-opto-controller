# Real-time closed-loop optogenetics controller config.
# Keys map 1:1 to controller/config.py (ControllerConfig). Anything omitted
# uses the dataclass default. Edit the >>> FILL IN <<< values for your rig.

# To run, go to RT controller root directory and run python -m controller.run configs/controller_config.yaml

# --- Frame source -----------------------------------------------------------
source: "flir"                 # "flir" | "video" | "synthetic"
source_video: ""               # required only when source == "video"
frame_rate: 30.0               # MUST match the fps the model was trained at
rec_time_sec: 0.0            # 0 => run until Ctrl-C. Recorded as frame_rate*rec_time_sec frames, counted from the first frame that actually arrives.
max_frames: 0.0                # Max number of frames, overrides recording time. 0 => unlimited

# --- Camera (FLIR) ----------------------------------------------------------
# These camera_* fields describe a SINGLE camera AND serve as the defaults that
# every entry in the `cameras:` list below inherits when it omits a field.
camera_make: "flir"
camera_selection: 0
camera_name: "Camera0"
frame_width: 1280              # MUST match training-video resolution (1280)
frame_height: 1024             # MUST match training-video resolution (1024)
pixel_format_input: "gray"     # "gray" (mono8) | "rgb24" | "bayer_rggb8"
camera_trigger: "Line3"        # hardware trigger line (paces the loop), or "None"
camera_exposure_us: 500
camera_gain: 0.0
disable_gamma: false
buffer_mode: "OldestFirst"
buffer_size: 100
camera_debug: false

# --- Multi-camera -----------------------------------------------------------
# Leave `cameras: []` to record just the single camera defined above (legacy).
# To run several cameras at once, list each one here. EVERY listed camera is
# recorded to its own video subfolder (output_folder/<timestamp>_session/
# <camera_name>/); exactly ONE -- the one whose camera_name matches
# `inference_camera` -- is fed to the model. Each entry overrides ONLY the
# fields it names; everything else is inherited from the camera_* values above,
# so identical cameras only need camera_name + camera_selection.
inference_camera: "Camera0"   # must equal one camera_name below
cameras:
  - camera_name: "Camera0"
    camera_selection: 0
  - camera_name: "Camera1"
    camera_selection: 1
  - camera_name: "Camera2"
    camera_selection: 2
  - camera_name: "Camera3"
    camera_selection: 3
  - camera_name: "Camera4"
    camera_selection: 4

# --- Model / inference ------------------------------------------------------
model_checkpoint: "utils/checkpoints/supervised_attack_best_model.pt"
device: "cuda"                 # "auto" | "cuda" | "mps" | "cpu"
spatial_scale: null            # null => use the value stored in the checkpoint

# --- Classification -> stim decision ---------------------------------------
trigger_classes: [1]  # >>> FILL IN <<< class indices that fire the laser NOTE: these are 0-indexed (relative to how I've been plotting the clusters which are 1-indexed).
class_names: ["Non-attack", "Attack"]                # optional, for human-readable logging
onset_frames: 1                # consecutive trigger frames to register an event onset
offset_frames: 1               # UNUSED in fixed-duration mode (kept for logging)
# Fixed-duration mode: each detected onset fires the pulse train for this many
# seconds, independent of the event's length. A new onset within an active train
# resets the timer to the new onset.
stim_duration_sec: 25.0
# Ignore a new onset within this many seconds of the last one. With
# onset_frames: 1 a classifier that flickers 1,0,1,0,... triggers an onset on
# every other frame, which re-STARTs the board (re-zeroing its pulse counter)
# many times a second -- the animal then gets pulses at the retrigger rate
# rather than at frequency_hz. 0.0 => disabled (previous behaviour).
stim_refractory_sec: 0.0

# --- Stim Arduino (NEW board, arduino/stim_controller/stim_controller.ino) --
stim_enabled: true # *** IMPORTANT ***
stim_serial_port: "COM12"           # >>> FILL IN <<< e.g. "COM5" or "/dev/ttyACM1"
stim_baud: 115200
stim_pin: 9                    # digital TTL pin into the laser driver gate
pulse_width_us: 5000           # HIGH time per pulse
frequency_hz: 3.0              # pulse rate while stimulating
max_pulses: 75                 # hardware safety cap per train; 0 => no cap. Match to round(stim_duration_sec*frequency_hz) = 25*3 = 75
watchdog_ms: 500               # laser auto-OFF if controller stops sending keepalives
keepalive_ms: 150              # how often to refresh the watchdog while ON
 
# --- Camera-trigger Arduino (arduino/camera_controller/trigger.ino) --------
cam_trigger_enabled: true
cam_trigger_serial_port: "COM4"
cam_trigger_baud: 115200
cam_trigger_pins: [6]

# Set true to run the whole pipeline with NO serial hardware (commands logged).
serial_dry_run: false

# --- Output (video + per-frame log) ----------------------------------------
output_folder: "./rt_opto_recordings"
session_name: "test"               # session subfolder name (under output_folder). "" => timestamped. Each camera gets <session_name>/<camera_name>/ with its video, classifications.csv, and metadata.csv. NOTE: reusing a name reuses the folder.
video_filename: "session.mp4"
# These four are what campy used on this rig (campy_config_Midler.yaml), and
# together they reproduce its exact ffmpeg invocation:
#   hevc_nvenc  -preset fast -qp 24 -bf:v 0 -gpu 0 -vsync 0
# Think twice before setting gpu_id back to -1: the CPU branch
# adds "-tune fastdecode" (which DISABLES the deblocking filter -> blocky video)
# and a hard "-maxrate 10M" ceiling that overrides the crf target.
codec: "h265"                  # "h264" | "h265"
quality: 24                    # lower = higher quality / bigger files (-qp on nvenc)
preset: "fast"
gpu_id: 0                      # -1 => CPU encode (see note above); 0+ => GPU index
gpu_make: "nvidia"             # "nvidia" | "amd" | "intel"
pixel_format_output: "rgb0"
ffmpeg_log_level: "warning"

# --- Live preview -----------------------------------------------------------
preview_enabled: true          # show a live window with class + STIM ON/OFF overlay
preview_fps: 24.0              # display refresh rate (independent of acquisition)
preview_downsample: 1          # show every Nth pixel (smaller/faster window)

# --- Latency / backpressure -------------------------------------------------
warn_factor: 0.95               # warn when a frame uses > this fraction of budget
warn_min_interval_sec: 2.0     # rate-limit repeated warnings
write_queue_maxsize: 256       # bounded video queue (protects against OOM)
drop_video_when_full: true     # drop video frames (never log/inference) if overloaded
